[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "openbeavs-backend"
version = "0.1.0"
description = "OpenBeavs v2 backend (prototype): Chris orchestrator."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    # Chris is a Google ADK agent served over A2A (app/chris). ADK's A2A support is
    # marked experimental by Google, so pin the ADK and A2A SDK versions together.
    "google-adk[a2a]==2.13.0",
    "a2a-sdk[http-server]==1.3.0",
    # Chris calls Gemini directly when registry selection/delegation is unavailable.
    "google-genai>=2.30,<3",
    # Registry A2A agent (token verification and the SDK client script).
    "google-auth>=2.30",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # ADK prints this on every A2A object it creates; it is not a problem in our code.
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
]
