[project]
name = "openbeavs-backend"
version = "0.1.0"
description = "OpenBeavs v2 backend (prototype): Chris orchestrator."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
