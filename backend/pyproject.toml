[project]
name = "openbeavs-backend"
version = "0.1.0"
description = "OpenBeavs v2 end-to-end tests: the tests and the fake-model stack that run the Chat System and the Agent Registry together."
requires-python = ">=3.12"
dependencies = [
    # Application Services (../chat-system/application-services), the Conversation Agent
    # (../chat-system/conversation-agent) and the Agent Registry (../agent-registry) are
    # packages of their own. The tests here and the fake-model stack run them together,
    # so this environment installs all three from their folders as editable packages,
    # with the libraries they bring.
    "openbeavs-agent-registry",
    "openbeavs-application-services",
    "openbeavs-conversation-agent",
]

# This folder holds tests and a script, and no package of its own.
[tool.uv]
package = false

[tool.uv.sources]
openbeavs-agent-registry = { path = "../agent-registry", editable = true }
openbeavs-application-services = { path = "../chat-system/application-services", editable = true }
openbeavs-conversation-agent = { path = "../chat-system/conversation-agent", editable = true }

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # ADK prints this on every A2A object it creates; it is not a problem in our code.
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
]
