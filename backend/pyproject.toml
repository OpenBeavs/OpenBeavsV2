[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "openbeavs-backend"
version = "0.1.0"
description = "OpenBeavs v2 backend (prototype): the chat API."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "pyjwt[crypto]>=2.8.0",
    # Chat calls Chris over A2A with the SDK client. Pinned to the version Chris uses.
    "a2a-sdk[http-server]==1.3.0",
    # The Agent Registry (../agent-registry) and the Conversation Agent
    # (../chat-system/conversation-agent) are packages of their own. The pipeline stack
    # and the tests here that run them beside the chat API import them from these
    # editable installs; the chat API's own code imports neither.
    "openbeavs-agent-registry",
    "openbeavs-conversation-agent",
]

[tool.uv.sources]
openbeavs-agent-registry = { path = "../agent-registry", editable = true }
openbeavs-conversation-agent = { path = "../chat-system/conversation-agent", editable = true }

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # ADK prints this on every A2A object it creates; it is not a problem in our code.
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
]
