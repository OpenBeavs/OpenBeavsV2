[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "openbeavs-backend"
version = "0.1.0"
description = "OpenBeavs v2 backend (prototype): Chris orchestrator."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "pyjwt[crypto]>=2.8.0",
    # Chris is a Google ADK agent served over A2A (app/chris). ADK's A2A support is
    # marked experimental by Google, so pin the ADK and A2A SDK versions together.
    "google-adk[a2a]==2.13.0",
    "a2a-sdk[http-server]==1.3.0",
    # Chris calls Gemini directly when registry selection/delegation is unavailable.
    "google-genai>=2.30,<3",
    # The Agent Registry is its own package (../agent-registry). Until the Chat System
    # has packages of its own, the code and tests here that start the registry or check
    # an expert's URL import it from this editable install.
    "openbeavs-agent-registry",
]

[tool.uv.sources]
openbeavs-agent-registry = { path = "../agent-registry", editable = true }

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # ADK prints this on every A2A object it creates; it is not a problem in our code.
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
]
