name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent-registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-registry
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      # Includes the test that no other system's package is importable here.
      - run: uv run pytest

  conversation-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-system/conversation-agent
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      # Includes the test that no other system's package is importable here.
      - run: uv run pytest

  application-services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-system/application-services
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      # Includes the stateless-chat privacy, sign-in and migration tests, and the test
      # that no other system's package is importable here.
      - run: uv run pytest

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      # The tests that run the Chat System and the Agent Registry together.
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ../agent-registry ../chat-system/conversation-agent ../chat-system/application-services -r ../backend/requirements-dev.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:pipeline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
